name: CI/CD Pipeline for LocalCabService

on:
  push:
    branches:
      - master
      - 'feature/*'
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up JDK (Java Development Kit)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Cache Maven dependencies to speed up builds
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # Step 4: Debug - List directory structure
    - name: List directory structure
      run: find .

    # Step 5: Build the project with Maven
    - name: Build with Maven
      run: mvn clean install -DskipTests
      working-directory: cabservice 

    # Step 6: Run tests with Maven
    - name: Run tests
      run: mvn test
      working-directory: cabservice 
    # Step 7: Package the application
    - name: Package application
      run: mvn package -DskipTests
      working-directory: cabservice 

    # Step 8: Upload the artifact (e.g., JAR/WAR file)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: cab-service-artifact
        path: cabservice/target/*.jar  
        if-no-files-found: warn
        retention-days: 30
        overwrite: true
